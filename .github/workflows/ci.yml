name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Dummy value so settings load. The current tests do not connect to a database.
      DATABASE_URL: postgresql+psycopg://vinayaka:vinayaka@localhost:5432/vinayaka
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest
